const CHARS = {

const PGW = 18, PGH = 30;

    case 'bowl': put(x0 - 1, top - 2, hw + 2, 4, hc); put(x0, top + 2, hw, 1, hc); break;

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!m.wall[r][c] && m.obj[r][c]) drawProp(g, m.obj[r][c], c, r);
  m.layer = cv;
  m.solid = (c, r) => c < 0 || r < 0 || c >= COLS || r >= ROWS || m.wall[r][c] || !SOLID_OK.has(m.obj[r][c]);
  return m;
}

// ---- The game ---------------------------------------------------------------------------
const SAVE_KEY = 'muhan-sangsa-daesawang';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ cleared: state.cleared, tries: state.tries, char: state.char })); } catch (e) { /* a private window: nothing kept */ } }
const EPS = QUIZ.episodes;
const norm = s => String(s).toLowerCase().replace(/[\s.,!?~…'"“”‘’\-·()]/g, '');
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function typedRight(q, given) {
  const g = norm(given); if (!g) return false;
  return [q.a, ...(q.alt || [])].some(c => { const n = norm(c); return g === n || (n.length >= 4 && editDistance(g, n) <= tune.typo_slack); });
}
const speakerName = q => q.name || (CHARS[q.who] || CHARS.guest).name;
const speakerKey = q => (CHARS[q.who] ? q.who : 'guest');

let scene, state, hubMap;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const saved = loadSave();
  hubMap = buildHub();
  state = {
    t: 0, mode: 'hub', score: 0, gained: '', goal: false,
    cleared: saved.cleared || {},            // episode id -> best score
    tries: saved.tries || {},                // episode id -> how many times the room was entered
    char: saved.char || null, cc: null,      // the player's character; cc is the character screen
    map: hubMap, room: null, q: null, last: null, report: null,
    p: { x: 3 * T + 8, y: 6 * T, face: 1, walk: 0, frame: 0 },
    toast: null, near: null,
  };
  state.score = totalScore();
  applyChar(state.char || DEFAULT_CHAR);
}
function totalScore() { const v = EPS.map(e => state.cleared[e.id] || 0); return Math.round(v.reduce((a, b) => a + b, 0) / Math.max(1, EPS.length)); }
const unlocked = i => i === 0 || state.cleared[EPS[i - 1].id] != null;
const allCleared = () => EPS.every(e => state.cleared[e.id] != null);
const totalTries = () => EPS.reduce((a, e) => a + (state.tries[e.id] || 0), 0);
const playerName = () => (state.char && state.char.name) || '신입사원';
function openCreate() { state.cc = { row: 0, char: Object.assign({}, DEFAULT_CHAR, state.char || {}) }; scene = 'create'; }
function toast(msg, secs = 3) { state.toast = { msg, t: secs }; }

function startRoom(i) {
  const ep = EPS[i], map = buildRoom(ep.theme);
  const picked = shuffle(ep.questions.slice()).slice(0, tune.questions_per_room);
  const npcs = [];
  for (const q of picked) {
    const who = speakerKey(q), key = who === 'guest' ? speakerName(q) : who; // one figure per person, never a clone
    let n = npcs.find(v => v.key === key);
    if (!n) { const s = map.spots[npcs.length % map.spots.length]; n = { key, who, name: who === 'guest' ? speakerName(q) : CHARS[who].name, x: s[0] * T + 8, y: s[1] * T + 14, queue: [], marks: [] }; npcs.push(n); }
    n.queue.push(q);
  }
  state.map = map;
  state.tries[ep.id] = (state.tries[ep.id] || 0) + 1; writeSave();
  state.room = { ep: i, npcs, total: picked.length, asked: 0, correct: 0, log: [], attempt: state.tries[ep.id] };
  state.p.x = 15 * T; state.p.y = 14 * T + 12; state.p.face = -1;
  state.mode = 'intro'; state.t = 0; state.q = null; state.last = null; state.report = null;
  events.push({ type: 'enter', ep: ep.id }); sfx.door();
}
function exitToHub(i, msg) {
  state.map = hubMap; state.room = null; state.mode = 'hub';
  state.p.x = hubDoorCol(i, EPS.length) * T + 8; state.p.y = 3 * T + 14; state.p.face = 1;
  if (msg) toast(msg, 4);
}
function ask(npc) {
  const r = state.room, q = npc.queue.shift();
  const canChoose = q.wrong && q.wrong.length >= 3;
  let typed;
  if (q.t === 'c' && canChoose) typed = false; else if (q.t === 't' || !canChoose) typed = true;
  else if (r.ep === 0 && r.asked === 0) typed = false;      // the first question is a choice
  else if (r.ep === 0 && r.asked === 1) typed = true;       // the second is typed
  else typed = rng() < tune.typed_ratio + r.ep * tune.typed_ramp;
  const limit = typed ? tune.type_time : tune.choice_time;
  state.q = { q, npc, typed, options: typed ? [] : shuffle([q.a, ...q.wrong.slice(0, 3)]), sel: 0, left: limit, limit };
  state.mode = 'quiz'; r.asked++;
  answerEl.value = ''; typedSubmit = null; submitAfterCompose = false;
  sfx.talk();
}
function resolve(given, timeout) {
  const Q = state.q, ok = !timeout && (Q.typed ? typedRight(Q.q, given) : given === Q.q.a);
  const r = state.room;
  if (ok) r.correct++;
  Q.npc.marks.push(ok);
  state.last = { q: Q.q, ok, given: timeout ? '' : given, timeout, typed: Q.typed };
  r.log.push(state.last);
  state.mode = 'reveal'; state.t = 0;
  events.push({ type: 'answer', ok });
  ok ? sfx.right() : sfx.wrong();
}
function finishRoom() {
  const r = state.room, score = Math.round(100 * r.correct / r.total), pass = score > tune.pass_score;
  state.report = { score, pass, wrong: r.log.filter(l => !l.ok), page: 0, pages: 1 };
  state.mode = 'report';
  pass ? sfx.clear() : sfx.fail();
}
function closeReport() {
  const r = state.room, rep = state.report, ep = EPS[r.ep];
  if (!rep.pass) { startRoom(r.ep); return; }
  const first = state.cleared[ep.id] == null;
  state.cleared[ep.id] = Math.max(state.cleared[ep.id] || 0, rep.score);
  state.score = totalScore(); writeSave();
  const done = allCleared();
  exitToHub(r.ep, done ? '모든 회차 통과! 복도 끝 사장실로 가세요.' : first ? `${r.ep + 1}회차 통과! 다음 문이 열렸습니다.` : `${r.ep + 1}회차 다시 통과: ${rep.score}점`);
  sfx.door();
}

function movePlayer(dt) {
  const p = state.p, m = state.map;
  let dx = (down.has('ArrowRight') || down.has('KeyD') ? 1 : 0) - (down.has('ArrowLeft') || down.has('KeyA') ? 1 : 0);
  let dy = (down.has('ArrowDown') || down.has('KeyS') ? 1 : 0) - (down.has('ArrowUp') || down.has('KeyW') ? 1 : 0);
  if (!dx && !dy) { p.frame = 0; p.walk = 0; return; }
  const k = (dx && dy ? 0.7071 : 1) * tune.walk_speed * dt;
  if (dx) p.face = dx;
  const free = (x, y) => {
    for (const [ox, oy] of [[-4, -5], [4, -5], [-4, 0], [4, 0]]) if (m.solid(Math.floor((x + ox) / T), Math.floor((y + oy) / T))) return false;
    if (state.room) for (const n of state.room.npcs) if (Math.abs(n.x - x) < 11 && Math.abs(n.y - y) < 7) return false;
    return true;
  };
  if (dx && free(p.x + dx * k, p.y)) p.x += dx * k;
  if (dy && free(p.x, p.y + dy * k)) p.y += dy * k;
  p.walk += dt; p.frame = 1 + (Math.floor(p.walk * 8) % 2);
}
function findNear() { // the nearest thing the player can act on
  const p = state.p, range = tune.talk_range; let best = null, bd = range;
  for (const d of state.map.doors) {
    const dist = Math.hypot(d.c * T + 8 - p.x, d.r * T + 8 - (p.y - 3));
    if (dist < bd) { bd = dist; best = { door: d }; }
  }
  if (state.room) for (const n of state.room.npcs) {
    const dist = Math.hypot(n.x - p.x, n.y - p.y);
    if (dist < bd && n.queue.length) { bd = dist; best = { npc: n }; }
  }

}
function nearLabel(n) {

  const d = n.door;

}

    }
    const done = state.cleared[EPS[d.ep].id] != null, open = unlocked(d.ep);
    drawDoor(ctx, x, y, done ? '#3f8a5a' : open ? '#c4803a' : '#6c7586');
    frameBox(x - 4, y - 26, 24, 13, done ? '#bfe8c8' : open ? PAPER : '#aab0bc'); text(`${d.ep + 1}회차`, x + 8, y - 19, 8, INK, 'center', true);
    box(x + 6, y - 11, 4, 4, INK); box(x + 7, y - 10, 2, 2, done ? '#5af08a' : open ? '#ffd860' : '#c8343a'); // the lamp
    if (!open) { box(x + 5, y + 7, 6, 5, INK); box(x + 6, y + 5, 4, 2, INK); box(x + 7, y + 6, 2, 1, '#6c7586'); box(x + 7, y + 9, 2, 1, GOLD); } // a padlock
  }
  const list = [{ y: p.y, draw: () => drawPerson('player', p.x, p.y + oy, p.frame) }];
  if (state.room) for (const n of state.room.npcs) list.push({ y: n.y, draw: () => {
    const bob = n.queue.length && Math.floor(state.t * 2 + n.x) % 2 ? 1 : 0;
    drawPerson(n.who, n.x, n.y + oy, 0);
    const top = n.y + oy - 34;
    if (n.queue.length) drawPaperIcon(n.x, top - bob, n.queue.length);
    else n.marks.forEach((ok, i) => drawMark(n.x - (n.marks.length - 1) * 6 + i * 12, top + 2, ok));
  } });
  list.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // HUD strip
  box(0, 0, W, HUD, INK);
  if (state.room) {
    const r = state.room, ep = EPS[r.ep];
    text(`${r.ep + 1}회차 · ${ep.title}`, 6, 7.5, 9, '#ffffff', 'left', true);
    text(`시도 ${r.attempt}회 · 문제 ${r.asked}/${r.total} · 정답 ${r.correct}`, W - 6, 7.5, 9, '#ffd860', 'right', true);
  } else {
    text(`무한상사 본사 복도 · ${playerName()}`, 6, 7.5, 9, '#ffffff', 'left', true);
    text(`총 시도 ${totalTries()}회 · 통과 ${EPS.filter(e => state.cleared[e.id] != null).length}/${EPS.length} 회차 · 평균 ${state.score}점${muted ? ' · 음소거' : ''}`, W - 6, 7.5, 9, '#ffd860', 'right', true);
  }
  if (state.mode === 'hub' || state.mode === 'room') {
    const label = nearLabel(state.near);
    if (label) { ctx.font = fontOf(10, true); const w = ctx.measureText(label).width + 16; frameBox(Math.round(W / 2 - w / 2), H - 22, Math.round(w), 17, PAPER); text(label, W / 2, H - 13, 10, INK, 'center', true); }
    else if (state.toast) { ctx.font = fontOf(10, true); const w = ctx.measureText(state.toast.msg).width + 16; frameBox(Math.round(W / 2 - w / 2), H - 22, Math.round(w), 17, GOLD); text(state.toast.msg, W / 2, H - 13, 10, INK, 'center', true); }
    else if (state.mode === 'hub' && state.t < 6 && !Object.keys(state.cleared).length) { frameBox(120, H - 22, 240, 17, PAPER); text('방향키로 걸어서 불 켜진 문 앞에서 Space', W / 2, H - 13, 10, INK, 'center', true); }
    else if (state.mode === 'room' && state.room.asked === 0) { frameBox(110, H - 22, 260, 17, PAPER); text('서류를 든 상사에게 다가가 Space로 말을 거세요', W / 2, H - 13, 10, INK, 'center', true); }
  }
}
function drawIntro() { // the motto frame flashes as you walk in
  const ep = EPS[state.room.ep], t = state.t, flash = t < 0.5 && Math.floor(t * 12) % 2 === 0;
  box(0, 0, W, H, 'rgba(10,12,30,0.72)');
  frameBox(90, 70, 300, 120, flash ? '#ffffff' : GOLD); box(96, 76, 288, 108, flash ? '#fff4c0' : PAPER);
  text('무한~ 상사!', W / 2, 96, 12, RED, 'center', true);
  text(`${state.room.ep + 1}회차`, W / 2, 116, 11, NAVY, 'center', true);
  text(ep.title, W / 2, 136, 17, INK, 'center', true);
  const lines = layout([[ep.intro || '', NAVY]], 260, 9, false);
  drawLines(lines.slice(0, 2), W / 2 - 130, 158, 9, false, 12);
  text(ep.aired || '', W - 100, 84, 8, '#6c7586', 'right');
}
const PANEL = { x: 36, y: 20, w: 408, h: 238 };
function drawPanel(title) {
  box(0, 0, W, H, 'rgba(10,12,30,0.6)');
  frameBox(PANEL.x, PANEL.y, PANEL.w, PANEL.h, PAPER);
  box(PANEL.x + 1, PANEL.y + 1, PANEL.w - 2, 16, NAVY); text(title, PANEL.x + 8, PANEL.y + 9.5, 10, '#ffffff', 'left', true);
  // approval boxes, like a form that goes up for sign-off
  for (let i = 0; i < 3; i++) { frameBox(PANEL.x + PANEL.w - 26 - i * 22, PANEL.y + 20, 23, 22, PAPER); text(['부장', '차장', '담당'][i], PANEL.x + PANEL.w - 14.5 - i * 22, PANEL.y + 26, 8, '#6c7586'); }
}
function drawStamp(x, y, label, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.2);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(-24, -13, 48, 26); ctx.lineWidth = 1; ctx.strokeRect(-21, -10, 42, 20);
  text(label, 0, 0.5, 14, col, 'center', true); ctx.restore();
}
function quoteSegs(q, fill, col) { return [['"' + q.pre, INK], [fill, col], [q.post + '"', INK]]; }
function drawQuiz() {
  const Q = state.q, q = Q.q, r = state.room, reveal = state.mode === 'reveal', L = state.last;
  drawPanel(`결재 서류 · ${r.ep + 1}회차 ${r.asked}/${r.total}번 · ${Q.typed ? '주관식' : '객관식'}`);
  const px = PANEL.x, py = PANEL.y;
  frameBox(px + 10, py + 22, 36, 42, '#dcd7cf'); drawPerson(Q.npc.who, px + 28, py + 60, 0);
  text(speakerName(q), px + 54, py + 30, 11, NAVY, 'left', true);
  drawLines(layout([[q.ctx || '', '#4a4e60']], 268, 9, false).slice(0, 2), px + 54, py + 45, 9, false, 12);
  // the line
  box(px + 10, py + 70, PANEL.w - 20, 1, '#c6c0b6');
  const core = Q.typed ? '□'.repeat(Math.max(1, norm(q.a).length)) : '( ? )';
  const blank = (q.pre && !q.pre.endsWith(' ') ? ' ' : '') + core + (q.post && !q.post.startsWith(' ') ? ' ' : '');
  const segs = reveal ? quoteSegs(q, q.a, L.ok ? GREEN : RED) : quoteSegs(q, blank, ORANGE);
  const lines = layout(segs, PANEL.w - 32, 13, true);
  drawLines(lines.slice(0, 4), px + 16, py + 86, 13, true, 17);
  const oy = py + 146;
  if (!reveal) {
    if (Q.typed) {
      text('빈칸에 들어갈 말을 한글로 입력하고 Enter', W / 2, oy + 2, 10, NAVY, 'center', true);
      frameBox(ANSWER_BOX.x - 2, ANSWER_BOX.y - 2, ANSWER_BOX.w + 4, ANSWER_BOX.h + 4, '#ffffff', ORANGE);
      text(`${norm(q.a).length}글자 (띄어쓰기와 문장부호는 빼고 셉니다)`, W / 2, ANSWER_BOX.y + ANSWER_BOX.h + 12, 9, '#4a4e60');
    } else Q.options.forEach((o, i) => {
      const y = oy - 8 + i * 18, on = i === Q.sel;
      frameBox(px + 14, y, PANEL.w - 28, 16, on ? '#ffe9b0' : '#ffffff', on ? ORANGE : '#8a8f9c');
      frameBox(px + 16, y + 2, 12, 12, on ? ORANGE : NAVY); text(String(i + 1), px + 22, y + 8.5, 9, '#ffffff', 'center', true);
      text(o, px + 34, y + 8.5, 11, INK, 'left', on);
    });
    // the clock
    const f = Math.max(0, Q.left / Q.limit), by = py + PANEL.h - 16;
    frameBox(px + 14, by, PANEL.w - 80, 8, '#ffffff'); box(px + 15, by + 1, Math.round((PANEL.w - 82) * f), 6, f > 0.35 ? GREEN : RED);
    text(`${Math.ceil(Q.left)}초`, px + PANEL.w - 16, by + 4.5, 10, f > 0.35 ? INK : RED, 'right', true);
  } else {
    drawStamp(px + PANEL.w - 60, oy + 26, L.ok ? '정답' : '오답', L.ok ? GREEN : RED);
    const mine = L.timeout ? '시간 초과' : L.given;
    text(L.ok ? '정확합니다!' : `내 답: ${mine}`, px + 16, oy + 6, 11, L.ok ? GREEN : RED, 'left', true);
    text(`정답: ${q.a}`, px + 16, oy + 24, 11, INK, 'left', true);
    if (q.note) drawLines(layout([[q.note, '#4a4e60']], PANEL.w - 130, 9, false).slice(0, 2), px + 16, oy + 42, 9, false, 12);
    text(state.room.asked >= state.room.total ? 'Space: 결과 보고서 보기' : 'Space: 계속', W / 2, py + PANEL.h - 12, 10, NAVY, 'center', true);
  }
}
function drawReport() {
  const rep = state.report, r = state.room, ep = EPS[r.ep];
  drawPanel(`결과 보고서 · ${r.ep + 1}회차 ${ep.title}`);
  const px = PANEL.x, py = PANEL.y;
  text(`${rep.score}점`, px + 16, py + 34, 22, rep.pass ? GREEN : RED, 'left', true);
  text(`${r.attempt}번째 시도 · ${r.total}문제 중 ${r.correct}개 정답`, px + 90, py + 30, 10, INK, 'left', true);
  text(rep.pass ? '통과했습니다. 다음 회차 문이 열립니다.' : `${tune.pass_score}점 이하입니다. 이 방을 다시 풉니다.`, px + 90, py + 44, 10, rep.pass ? GREEN : RED, 'left', true);
  drawStamp(px + PANEL.w - 112, py + 37, rep.pass ? '통과' : '반려', rep.pass ? GREEN : RED);
  box(px + 10, py + 56, PANEL.w - 20, 1, '#c6c0b6');
  const top = py + 68, bottom = py + PANEL.h - 22;
  if (!rep.wrong.length) text('틀린 문제가 없습니다. 전부 정답!', W / 2, top + 40, 12, GREEN, 'center', true);
  else {
    // lay the wrong answers out page by page
    const blocks = rep.wrong.map(l => ({ l, lines: layout([[`${speakerName(l.q)}: `, NAVY], ...quoteSegs(l.q, l.q.a, GREEN)], PANEL.w - 36, 10, true) }));
    const pages = [[]]; let y = top;
    for (const b of blocks) { const hgt = b.lines.length * 13 + 16; if (y + hgt > bottom && pages[pages.length - 1].length) { pages.push([]); y = top; } pages[pages.length - 1].push(b); y += hgt; }
    rep.pages = pages.length; y = top;
    text(`틀린 문제 ${rep.wrong.length}개${pages.length > 1 ? ` (${rep.page + 1}/${pages.length}쪽)` : ''}`, px + PANEL.w - 16, py + PANEL.h - 12, 9, '#4a4e60', 'right');
    for (const b of pages[Math.min(rep.page, pages.length - 1)]) {
      drawMark(px + 20, y + 1, false);
      y = drawLines(b.lines, px + 30, y, 10, true, 13);
      text(`내 답: ${b.l.timeout ? '시간 초과' : b.l.given}`, px + 30, y, 9, RED, 'left'); y += 16;
    }
  }
  const more = rep.page < rep.pages - 1;
  text(more ? 'Space: 다음 쪽' : rep.pass ? 'Space: 복도로 나가기' : 'Space: 다시 풀기', W / 2, py + PANEL.h - 12, 10, NAVY, 'center', true);
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && !typing) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); syncAnswer(); syncName(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
addEventListener('resize', fit); fit();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
